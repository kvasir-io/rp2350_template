name: Build Firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    container:
      image: docker.io/kvasirio/rp2350:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build firmware
        run: ./scripts/build.sh

      # the main TU's preprocessed lines against header_cost.toml (the image's Kvasir_SDK tools/header_cost.py): a TU
      # past its ceiling + margin fails; one far below says "lower it" and passes
      - name: Header cost
        run: python3 -B /opt/kvasir/tools/header_cost.py check header_cost.toml --tree docker_build

      # clang-tidy over the tree just built (the image's Kvasir_SDK: its tools/tidy.py and .clang-tidy, the same SDK the
      # firmware was built with): this repository's findings fail, the libraries' are counted as foreign
      - name: clang-tidy
        uses: kvasir-io/Kvasir_SDK/.github/actions/tidy@master
        timeout-minutes: 30
        with:
          trees: docker_build
          sdk: /opt/kvasir

      # a JavaScript action: GitHub puts node into the container, act does not ("node": executable file not found)
      - name: Upload firmware artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            docker_build/*.bin
            docker_build/*.hex
            docker_build/*.elf
            docker_build/*.uf2
            docker_build/*.lst
            docker_build/*.map
            docker_build/*_string_constants.json

  release:
    runs-on: ubuntu-latest
    needs: build_firmware
    if: github.ref == 'refs/heads/master'

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build

      - name: zip firmware
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r firmware.zip build

      - name: create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: firmware.zip
          tag: build-${{ github.run_number }}-${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Automated build from commit ${{ github.sha }}
            Run number: ${{ github.run_number }}
            Commit: ${{ github.event.head_commit.message }}
          prerelease: true
